/* 보정 스타일 */
.game, #teacher {width:100%; min-width:0}
.game {isolation:isolate}

<script>
const $=id=>document.getElementById(id);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const R=seed=>{let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647;};
/* ===== 사운드 ===== */
let snd=true,ac=null;
function beep(seq,type="sine",vol=.07){if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();let t=ac.currentTime;seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);t+=d*.85;});}catch(_){}}
const S={click:()=>beep([[700,.05]]),ok:()=>beep([[523,.08],[659,.08],[784,.14]]),bad:()=>beep([[240,.12],[170,.2]],"sawtooth",.05),get:()=>beep([[880,.07],[1175,.1]]),win:()=>beep([[523,.1],[659,.1],[784,.1],[1047,.1],[1319,.35]]),pop:()=>beep([[400,.04],[900,.06]])};

x solid #c9e7f5;color:#173b46;padding:1.1cqw 1.4cqw;font-size:1.8cqw;border-radius:1cqw">${["A","B","C"][k]}. ${o}</button>`).join("")}</div><div id="icemsg" style="font-size:1.6cqw;font-weight:700;min-height:2.6em;margin-top:1cqw"></div></div></div></div>`);

/* --- 활동 3: 바다 청소선 미니게임 --- */
function labSea(){
 const n=3;
 setMain(`${stepper(1,n)}<div class="labg"><div><canvas id="cv" width="640" height="400" style="cursor:none;touch-action:none"></canvas></div><div class="panel glass" id="lp"></div></div>`);
 const cv=$("cv"),x=cv.getContext("2d");
 let boat={x:120,y:200},tgt={x:120,y:200},items=[],got=0,hearts=3,tick=0,over=0,goal=8,err=0;
 const TR=[["🧴","plastic bottle"],["🥤","plastic cup"],["🛍️","plastic bag"],["🥫","can"],["🕸️","fishing net"]];
 const pm=e=>{const r=cv.getBoundingClientRect();tgt={x:(e.clientX-r.left)*640/r.width,y:(e.clientY-r.top)*400/r.height};};
 cv.onpointermove=pm;cv.onpointerdown=pm;
 const keys={};
 const kd=e=>{if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key))e.preventDefault();keys[e.key]=1;};
 const ku=e=>{keys[e.key]=0;};
 window.addEventListener("keydown",kd);window.addEventListener("keyup",ku);
 function panel(){
  $("lp").innerHTML=`<h3>🚤 Ocean Cleanup! <small>(바다 청소선 출동)</small></h3>
  <p>Move the boat, collect <b>${goal} pieces of trash</b>, and avoid the <b>dolphins 🐬</b>!<br><small>배를 움직여 쓰레기 ${goal}개를 줍고, 돌고래는 피하세요!</small></p>
  <div style="display:flex;gap:1cqw;align-items:center"><span class="chip">🗑️ ${got}/${goal}</span><span class="chip">${"❤️".repeat(hearts)}${"🖤".repeat(3-hearts)}</span></div>
  <div class="prog"><i style="width:${got/goal*100}%"></i></div>
  <p style="font-size:1.5cqw;opacity:.8">마우스·손가락 또는 방향키로 배를 움직여요.</p>`;
 }
 function stop(){over=1;window.removeEventListener("keydown",kd);window.removeEventListener("keyup",ku);if(window.__seaRaf)cancelAnimationFrame(window.__seaRaf);}
 function finish(){
  stop();sk.act=hearts===3?3:hearts===2?2:1;
  $("lp").innerHTML=`<h3>✅ Ocean Cleanup Complete!</h3>
   <p style="font-size:1.6cqw">You collected ${goal} pieces of trash and protected the dolphins!<br><small>쓰레기를 모두 줍고 돌고래를 지켰어요!</small></p>
   <p>활동 별점: ${"⭐".repeat(sk.act)}</p><button class="btn g" id="nx">보상 받기 ▶</button>`;
  $("nx").onclick=()=>clear(n,err);
 }
 function fail(){
  stop();
  modal(`<h3>🐬 돌고래를 피하세요!</h3><p>쓰레기는 줍고 돌고래와 부딪히지 않도록 배를 움직여 보세요.</p><div style="text-align:right"><button class="btn g" onclick="labSea()">다시 도전 ▶</button></div>`);
 }
 function frame(){
  if(over)return;
  tick++;
  if(keys.ArrowLeft)tgt.x-=5;if(keys.ArrowRight)tgt.x+=5;if(keys.ArrowUp)tgt.y-=5;if(keys.ArrowDown)tgt.y+=5;
  tgt.x=Math.max(24,Math.min(616,tgt.x));tgt.y=Math.max(34,Math.min(366,tgt.y));
  boat.x+=(tgt.x-boat.x)*.14;boat.y+=(tgt.y-boat.y)*.14;
  const g=x.createLinearGradient(0,0,0,400);g.addColorStop(0,"#5fd0ff");g.addColorStop(1,"#0b5aa5");x.fillStyle=g;x.fillRect(0,0,640,400);
  x.strokeStyle="#ffffff30";x.lineWidth=2;
  for(let i=0;i<9;i++){x.beginPath();for(let k=0;k<=640;k+=16){const yy=i*46+14+Math.sin((k+tick*2+i*40)/36)*5;k?x.lineTo(k,yy):x.moveTo(k,yy);}x.stroke();}
  if(tick%38===0){
   if(Math.random()<.72){const t=TR[Math.floor(Math.random()*TR.length)];items.push({e:t[0],n:t[1],trash:1,x:660,y:40+Math.random()*320,v:1.1+Math.random()*1.1,p:Math.random()*6});}
   else items.push({e:"🐬",trash:0,x:660,y:40+Math.random()*320,v:1.4+Math.random()*1,p:Math.random()*6});
  }
  x.font="30px serif";x.textAlign="center";x.textBaseline="middle";
  items=items.filter(it=>{
   it.x-=it.v;const yy=it.y+Math.sin(tick/30+it.p)*8;x.fillText(it.e,it.x,yy);
   if(Math.hypot(it.x-boat.x,yy-boat.y)<30){
    if(it.trash){got++;S.get();panel();if(got>=goal){finish();return false;}}
    else{hearts--;S.bad();panel();if(hearts<=0){fail();return false;}}
    return false;
   }
   return it.x>-30;
  });
  x.font="44px serif";x.fillText("🚤",boat.x,boat.y);x.textAlign="start";
  if(!over)window.__seaRaf=requestAnimationFrame(frame);
 }
 panel();frame();
}

/* --- 각 구역 클리어 후 확인 퀴즈 --- */
function quizStage(n){setMain(`${stepper(2,n)}<div class="scr" style="background:linear-gradient(#0e3a66,#0a2a4d)"><div style="width:14cqw;height:14cqw" class="float">${NORI("happy")}</div><div class="sub">마지막 관문! 퀴즈를 모두 맞히면 잠금이 풀려요.</div><button class="btn g" id="qs">퀴즈 시작 ▶</button></div>`);
 $("qs").onclick=()=>{let i=0,err=0;const qs=quiz[n];(function d(){const q=qs[i];modal(`<h3>🔐 확인 퀴즈 ${i+1}/${qs.length}</h3><div class="prog"><i style="width:${i/qs.length*100}%"></i></div><div class="q">${q.q}</div><div class="opts" id="op"></div>`);
  q.o.forEach((t,k)=>{const b=document.createElement("button");b.className="opt";b.textContent=q.o.length>2?`${"ABCD"[k]}. ${t}`:t;if(q.o.length===2)b.classList.add("c");b.onclick=()=>{if(k!==q.a){err++;shk();return fail("땡! 다시 생각해 봐요.");}S.ok();i++;if(i<qs.length){toast("✨ 정답!","good");d();}else{closeModal();clear(n,err);}};$("op").appendChild(b);});})();};}

async function clear(n,qerr){const c=Store.get(me),stars=sk.seek+sk.act;await Store.save(me,{[`stage_${n}_quiz_passed`]:true,[`stage_${n}_completed`]:true,[`stage_${n}_score`]:Math.max(c[`stage_${n}_score`]||0,stars),[AREA[n].key]:true});hud();S.win();const A=AREA[n];
 modal(`<h3>★ AREA CLEAR! ★</h3><div style="text-align:center;font-size:2.4cqw">탐색 ${"⭐".repeat(sk.seek)} · 활동 ${"⭐".repeat(sk.act)}</div><div class="bigic">${A.rw[0]}</div><div style="text-align:center;font-size:2.6cqw;font-weight:900">「${A.rw[1]}」 획득!</div><div style="text-align:center;font-size:1.9cqw">🌍 지구를 지키는 다음 미션으로 가 봐요!</div><div style="text-align:center;margin-top:1.4cqw"><button class="btn g" onclick="showMap()">지도로 ▶</button></div>`);}

/* ===== 최종 미션: 분리배출로 지구 지키기 ===== */
const BINS=[{id:"paper",ic:"📄",en:"Paper",ko:"종이"},{id:"plastic",ic:"♻️",en:"Plastic",ko:"플라스틱"},{id:"vinyl",ic:"🛍️",en:"Vinyl / Wrapper",ko:"비닐"},{id:"can",ic:"🥫",en:"Metal Can",ko:"캔·고철"},{id:"glass",ic:"🍾",en:"Glass",ko:"유리"},{id:"food",ic:"🍌",en:"Food Waste",ko:"음식물"},{id:"gen",ic:"🗑️",en:"General Waste",ko:"일반쓰레기"}];
const ITEMS=[
{e:"🧴",en:"Plastic bottle",ko:"페트병",c:"plastic",tip:"Empty it, rinse it, and take off the label.",tk:"내용물을 비우고 헹군 뒤 라벨을 떼요."},
{e:"🥤",en:"Plastic cup",ko:"플라스틱 컵",c:"plastic",tip:"Rinse it out before recycling.",tk:"깨끗이 헹궈서 버려요."},
{e:"🛍️",en:"Plastic bag",ko:"비닐봉지",c:"vinyl",tip:"Bags go in the vinyl bin. Shake out the dirt first.",tk:"이물질을 털어 비닐류로 버려요."},
{e:"🍪",en:"Snack wrapper",ko:"과자 봉지",c:"vinyl",tip:"Shake out the crumbs. Wrappers go with vinyl.",tk:"부스러기를 털고 비닐류로 버려요."},
{e:"🥫",en:"Tuna can",ko:"참치캔",c:"can",tip:"Empty and rinse it. Metal cans can be recycled again and again.",tk:"비우고 헹궈요. 캔은 몇 번이고 재활용돼요."},
{e:"📦",en:"Cardboard box",ko:"택배 상자",c:"paper",tip:"Remove the tape and flatten it.",tk:"테이프를 떼고 납작하게 펴요."},
{e:"📰",en:"Newspaper",ko:"신문지",c:"paper",tip:"Keep paper dry and tie it up.",tk:"젖지 않게 묶어서 배출해요."},
{e:"🥛",en:"Milk carton",ko:"우유팩",c:"paper",tip:"Rinse it, open it, and flatten it. Cartons are best collected apart from other paper.",tk:"헹구고 펼쳐서 말려요."},
{e:"🍾",en:"Glass bottle",ko:"유리병",c:"glass",tip:"Empty it and take off the cap.",tk:"비우고 뚜껑을 분리해요."},
{e:"🍌",en:"Banana peel",ko:"바나나 껍질",c:"food",tip:"Fruit peels are food waste.",tk:"과일 껍질은 음식물 쓰레기예요."},
{e:"🍗",en:"Chicken bones",ko:"닭뼈",c:"gen",tip:"Hard bones are general waste, not food waste!",tk:"단단한 뼈는 일반쓰레기예요!"},
{e:"🍕",en:"Greasy pizza box",ko:"기름 묻은 피자 상자",c:"gen",tip:"Paper with food or grease cannot be recycled.",tk:"기름 묻은 종이는 재활용이 안 돼요."}];
function pickSort(n){let o=[];BINS.forEach(b=>{const l=ITEMS.filter(x=>x.c===b.id);o.push(l[Math.floor(Math.random()*l.length)]);});const rest=shuf(ITEMS.filter(x=>!o.includes(x)));while(o.length<n)o.push(rest.shift());return shuf(o);}

function finalEntry(){sortingMission();}
function sortingMission(){
 let pool=pickSort(6),i=0,err=0;
 function drawSort(){
  const it=pool[i];
  setMain(`<div class="steps"><b>♻️ 지구 지킴이 분리배출 게임</b><span class="on">${i+1} / ${pool.length}</span></div><div style="padding:2.2cqw;background:linear-gradient(135deg,#dff7e8,#d9f1ff);color:#173b46;min-height:48cqw"><div style="max-width:900px;margin:auto"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:3.1cqw;margin:.4cqw 0">♻️ Sort It Right!</h2><span>🗑️ 분리수거 미션</span></div><div style="height:.8cqw;background:#b7d9cf;border-radius:2cqw;margin:1.4cqw 0;overflow:hidden"><div style="height:100%;width:${i/pool.length*100}%;background:#23966b"></div></div><div style="background:#fff;border:2px solid #c8e8d4;border-radius:1.6cqw;padding:2cqw;box-shadow:0 5px 0 #b6d9c4"><div style="text-align:center"><div style="font-size:7cqw">${it.e}</div><div style="font-size:2.4cqw;font-weight:900">${it.en}</div><div style="font-size:1.7cqw;color:#527078">${it.ko}</div><div style="font-size:1.9cqw;font-weight:900;margin:1.2cqw 0">Which bin does it go in?</div></div><div id="sortbins" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8cqw"></div><div id="sortmsg" style="font-size:1.6cqw;font-weight:700;min-height:3em;margin-top:1cqw"></div></div></div></div>`);
  let done=false;
  BINS.forEach(bin=>{
   const btn=document.createElement("button");btn.className="opt c";btn.style.cssText="padding:1cqw;font-size:max(12px,1.6cqw);background:#f8fffb;border:2px solid #cfe7d7;color:#173b46";btn.innerHTML=`${bin.ic} ${bin.en}<br><small style="font-weight:400">${bin.ko}</small>`;
   btn.onclick=()=>{
    if(done)return;
    if(bin.id!==it.c){err++;S.click();btn.style.borderColor="#d85b55";$("sortmsg").textContent="Not this bin. 다시 생각해 봐요.";return;}
    done=true;S.ok();btn.style.background="#e1f7e8";btn.style.borderColor="#23966b";
    $("sortmsg").innerHTML=`✅ ${bin.en}! ${it.tip}<br><small>${it.tk}</small>`;
    const next=document.createElement("button");next.className="btn g";next.style.marginTop="1cqw";next.textContent=i===pool.length-1?"지구 지키기 완료 ▶":"다음 물건 ▶";
    next.onclick=()=>{i++;if(i<pool.length)drawSort();else saveEarthEnding();};
    $("sortmsg").appendChild(document.createElement("br"));$("sortmsg").appendChild(next);
   };
   $("sortbins").appendChild(btn);
  });
 }
 drawSort();
}

async function saveEarthEnding(){
 const d=Store.get(me);
 await Store.save(me,{boss_defeated:true,boss_in_progress:false});
 hud();
 setMain(`<div class="scr end"><div style="font-size:16cqw" class="float">🌍</div><div class="ttl" style="font-size:8cqw">SAVE THE EARTH!</div><div class="jua" style="font-size:2.8cqw;color:#0d2745">작은 실천이 지구를 바꿔요! 💚</div>
 <div class="glass" style="color:#0d2745;padding:1.6cqw 2.4cqw;font-size:max(12px,1.8cqw);line-height:1.7;max-width:70cqw;text-align:left;background:#ffffffcc"><b>📘 오늘 배운 핵심 내용</b><br>① Turn off lights and save energy (불필요한 전등 끄기)<br>② Global warming and melting Arctic ice (지구온난화와 북극 얼음 감소)<br>③ Reduce plastic pollution and protect marine life (플라스틱 오염 줄이고 해양생물 보호하기)<br>④ Sort waste and recycle correctly (올바른 분리배출과 재활용)</div>
 <div class="chip" style="background:#fff;color:#0d2745;font-size:2cqw">🌱 지구 지킴이 미션 완료 · 총 ⭐ ${stars(d)}</div><button class="btn g" onclick="showMap()">지도로 돌아가기</button></div>`);
 const sc=document.querySelector(".end");for(let i=0;i<18;i++){const c=document.createElement("span");c.className="confetti";c.textContent=["🎉","⭐","💚","♻️","🌍"][i%5];c.style.left=(i*5.7)%100+"%";c.style.animationDuration=3+i%4+"s";c.style.animationDelay=-(i%5)+"s";sc.appendChild(c);}S.win();
}
function genPuzzle(){const MATES=["🐟","🦭","🐧","🐋"];for(;;){const B=Array.from({length:12},(_,i)=>({i,col:i%4,row:Math.floor(i/4),big:Math.random()<.5,mate:MATES[Math.floor(Math.random()*4)]}));const t=Math.floor(Math.random()*12),side=c=>c.col<2?"왼쪽":"오른쪽";const cand=B.filter(b=>b.big===B[t].big&&b.mate===B[t].mate&&side(b)===side(B[t]));if(cand.length===1)return{B,t,side:side(B[t])};}}
function findNori(T,st){const P=genPuzzle(),tgt=P.B[P.t];let tries=0,done=0;
 const clues=[[1,"📏 크기 단서",`노리는 <b>${tgt.big?"큰":"작은"}</b> 빙산 뒤에 숨었어!`],[2,"🐾 동료 단서",`노리 옆에는 <b>${tgt.mate}</b>가 있어!`],[3,"🧭 방향 단서",`노리는 화면 <b>${P.side}</b> 절반에 있어!`]];
 const ber=P.B.map(b=>`<button class="berg ${b.big?"":"sm"}" style="left:${14+b.col*24}%;top:${28+b.row*28}%" data-i="${b.i}" aria-label="빙산 ${b.i+1}"><svg viewBox="0 0 100 74"><polygon points="4,70 24,26 40,40 58,10 78,36 96,70" fill="#f4fbff" stroke="#9fd2ee" stroke-width="2" stroke-linejoin="round"/><polygon points="58,10 50,30 58,28 66,34" fill="#cfeaff"/><path d="M0 62Q25 56 50 62T100 62V74H0Z" fill="#2a86c2" opacity=".85"/></svg><span class="mate">${b.mate}</span></button>`).join("");
 setMain(`<div class="steps"><b>🔍 마지막 추리 — 노리는 어느 빙산 뒤에?</b><span class="on">정화된 북극 (+${T.toFixed(2)}℃)</span></div><div class="fn"><div class="board"><svg viewBox="0 0 160 90" preserveAspectRatio="none"><defs><linearGradient id="f1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd0ff"/><stop offset=".5" stop-color="#d9f2ff"/><stop offset=".5" stop-color="#3f9ad6"/><stop offset="1" stop-color="#0b4f92"/></linearGradient></defs><rect width="160" height="90" fill="url(#f1)"/><g fill="#fff" opacity=".6"><circle cx="20" cy="14" r="6"/><circle cx="28" cy="16" r="5"/><circle cx="120" cy="10" r="6"/></g></svg>${ber}<div class="mnori" style="top:2cqw;bottom:auto"><div class="av">${NORI("happy")}</div><div class="bub">단서 카드 3장을 모두 만족하는 빙산을 클릭해! <span id="tr"></span></div></div></div><div class="cards">${clues.map(c=>`<div class="cc"><b>${c[1]}</b> (AREA ${c[0]})<br>${c[2]}</div>`).join("")}</div></div>`,"");
 document.querySelectorAll(".berg").forEach(b=>b.onclick=()=>{if(done)return;const i=+b.dataset.i;if(i===P.t){done=1;S.win();b.innerHTML=`<div class="ob reveal" style="left:50%;top:50%;width:90%;height:90%">${NORI("happy")}</div>`;timers.push(setTimeout(()=>ending(T,st,tries),1300));}else{tries++;fail(`여기엔 ${P.B[i].mate}만 있어... 단서를 다시 확인!`);b.disabled=true;b.style.opacity=.4;$("tr").textContent=`(시도 ${tries})`}});}
async function ending(T,st,tries){await Store.save(me,{boss_defeated:true,boss_in_progress:false});hud();const d=Store.get(me);
 setMain(`<div class="scr end"><div style="width:20cqw;height:20cqw" class="float">${NORI("happy")}</div><div class="ttl" style="font-size:8cqw">SAVE THE EARTH!</div><div class="jua" style="font-size:2.8cqw;color:#0d2745">"고마워! 이제 나도 지구를 지킬 거야!" 🌍💙</div>
 <div class="glass" style="color:#0d2745;padding:1.6cqw 2.4cqw;font-size:max(12px,1.8cqw);line-height:1.7;max-width:70cqw;text-align:left;background:#ffffffcc"><b>📘 오늘 배운 핵심 영어 표현 & 내용</b><br>① Global warming & greenhouse gases (지구온난화와 온실가스)<br>② Arctic ice melting & polar bears (북극 해빙 감소와 북극곰)<br>③ Plastic pollution, microplastics & marine life (플라스틱 오염과 해양생물)<br>④ Renewable energy & recycling habits (재생에너지와 분리배출 습관)</div>
 <div class="chip" style="background:#fff;color:#0d2745;font-size:2cqw">2050년 +${T.toFixed(2)}℃ ${"⭐".repeat(st)} · 추리 시도 ${tries+1}회 · 총 ⭐ ${stars(d)}</div><button class="btn g" onclick="showMap()">지도로 돌아가기</button></div>`);
 const sc=document.querySelector(".end");for(let i=0;i<18;i++){const c=document.createElement("span");c.className="confetti";c.textContent=["🎉","⭐","💙","❄️","🌍"][i%5];c.style.left=(i*5.7)%100+"%";c.style.animationDuration=3+i%4+"s";c.style.animationDelay=-(i%5)+"s";sc.appendChild(c);}S.win();}

/* ===== 교사용 센터 ===== */
function toggleTeacher(){const t=$("teacher").classList.toggle("hidden");$("game").classList.toggle("hidden",!t);$("tbtn").textContent=t?"👩‍🏫 교사용":"🎮 게임으로";if(!t){clearAll();renderT();}}
function renderT(){const g=$("tg");g.innerHTML="";let l=0,c=0;for(let i=1;i<=99;i++){const d=Store.get(i);if(d.logged_in)l++;if(d.boss_defeated)c++;
 const e=document.createElement("div");e.className="tc"+(d.boss_defeated?" w":"");e.innerHTML=`<b>${i}번</b> ${d.logged_in?"●":"○"}<br>${[1,2,3].map(k=>`<span class="dt ${d[`stage_${k}_completed`]?"d":""}">A${k}${d[`stage_${k}_completed`]?" "+d[`stage_${k}_score`]+"★":""}</span>`).join("")}<br>${d.boss_defeated?"🏆 지구 지킴이 완료":d.boss_available?"🔥 최종 도전 가능":"탐험 중"}`;g.appendChild(e);}
 $("tsum").textContent=`접속 ${l}명 · 지구 지킴이 완료 ${c}명 / 99명 (별: 구역당 최대 6★)`;$("tstore").textContent=Store.mode==="shared"?"모든 기기의 진행이 공유됩니다.":"공유 서버가 없어 이 브라우저 안에서만 저장·집계됩니다.";}
async function resetAll(){if(!confirm("모든 학생 진행 데이터를 초기화할까요? 되돌릴 수 없습니다."))return;await Store.reset();renderT();}

showPre();Store.init();
